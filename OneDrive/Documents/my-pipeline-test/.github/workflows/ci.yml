name: CI

on:
    pull_request:
        branches:
            - main
            - develop
        paths:
            - "infra/**"
            - "bootstrap/**"
            - ".github/workflows/ci.yml"

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    pull-requests: write

jobs:
    terraform-fmt:
        name: Terraform Format Check
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v2
              with:
                  terraform_version: 1.6.0

            - name: Terraform Format Check
              run: |
                  terraform fmt -check -recursive infra/
                  terraform fmt -check -recursive bootstrap/

    terraform-validate:
        name: Terraform Validate
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v2
              with:
                  terraform_version: 1.6.0

            - name: Terraform Validate (Bootstrap)
              run: |
                  cd bootstrap
                  terraform init -backend=false
                  terraform validate

            - name: Terraform Validate (Infra)
              run: |
                  cd infra
                  terraform init -backend=false
                  terraform validate

    tflint:
        name: TFLint
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v2
              with:
                  terraform_version: 1.6.0

            - name: Cache TFLint
              uses: actions/cache@v3
              with:
                  path: ~/.tflint.d/plugins
                  key: ${{ runner.os }}-tflint-${{ hashFiles('.tflint.hcl') }}
                  restore-keys: |
                      ${{ runner.os }}-tflint-

            - name: Setup TFLint
              uses: terraform-linters/setup-tflint@v3
              with:
                  tflint_version: v0.48.0

            - name: TFLint Init
              run: |
                  tflint --init

            - name: TFLint Check (Bootstrap)
              run: |
                  cd bootstrap
                  tflint --format compact

            - name: TFLint Check (Infra)
              run: |
                  cd infra
                  tflint --format compact

    tfsec:
        name: TFSec Security Scan
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Run TFSec
              uses: aquasecurity/tfsec-action@v1.0.0
              with:
                  working_directory: "."
                  version: v1.28.0
                  args: "--format sarif --out tfsec-results.sarif infra bootstrap"

            - name: Upload TFSec Results
              if: always()
              uses: github/codeql-action/upload-sarif@v2
              with:
                  sarif_file: tfsec-results.sarif
                  category: tfsec

    terraform-plan:
        name: Terraform Plan (CI)
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v2
              with:
                  terraform_version: 1.6.0

            - name: Terraform Plan (Sandbox)
              run: |
                  cd infra/environments/sandbox
                  terraform init -backend=false
                  terraform plan -var-file=sandbox.tfvars -no-color -out=tfplan.bin 2>&1 | tee plan.txt || true
              env:
                  TF_VAR_azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
                  TF_VAR_azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}

            - name: Upload Plan Artifact
              if: always()
              uses: actions/upload-artifact@v3
              with:
                  name: ci-tfplan
                  path: infra/environments/sandbox/plan.txt
                  retention-days: 5
