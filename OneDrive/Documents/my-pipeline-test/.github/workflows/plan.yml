name: Plan

on:
    pull_request:
        branches:
            - main
            - develop
        paths:
            - "infra/**"
            - "bootstrap/**"
            - ".github/workflows/plan.yml"

concurrency:
    group: plan-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: read
    pull-requests: write

jobs:
    plan:
        name: Plan Sandbox
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v2
              with:
                  terraform_version: 1.6.0

            - name: Azure Login
              uses: azure/login@v1
              with:
                  client-id: ${{ secrets.AZURE_CLIENT_ID }}
                  client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
                  subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
                  tenant-id: ${{ secrets.AZURE_TENANT_ID }}

            - name: Terraform Init
              run: |
                  cd infra/environments/sandbox
                  terraform init

            - name: Terraform Plan
              id: plan
              run: |
                  cd infra/environments/sandbox
                  terraform plan \
                    -var-file=sandbox.tfvars \
                    -no-color \
                    -out=tfplan.bin \
                    2>&1 | tee plan.txt
              continue-on-error: true

            - name: Comment PR with Plan Summary
              uses: actions/github-script@v7
              if: always()
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  script: |
                      const fs = require('fs');
                      const planOutput = fs.readFileSync('infra/environments/sandbox/plan.txt', 'utf8');

                      // Extract plan summary
                      const lines = planOutput.split('\n');
                      const summaryLine = lines.find(l => 
                        l.includes('will be added') || 
                        l.includes('will be changed') || 
                        l.includes('will be destroyed') ||
                        (l.includes('No changes') && l.includes('infrastructure'))
                      );

                      const summary = summaryLine || 'Plan completed';

                      const comment = `## 📋 Terraform Plan Summary (Sandbox)

                      \`\`\`
                      ${summary}
                      \`\`\`

                      **Plan Log:**
                      \`\`\`
                      ${planOutput.substring(0, 3000)}${planOutput.length > 3000 ? '\n... (truncated)' : ''}
                      \`\`\`

                      ✅ CI checks completed. Review plan output above.`;

                      github.rest.issues.createComment({
                        issue_number: context.issue.number,
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        body: comment
                      });

            - name: Upload Plan Artifact
              if: always()
              uses: actions/upload-artifact@v3
              with:
                  name: plan-tfplan
                  path: infra/environments/sandbox/tfplan.bin
                  retention-days: 5
