name: Drift Detection

on:
    schedule:
        - cron: "0 3 * * *" # Daily at 3 AM UTC
    workflow_dispatch:

concurrency:
    group: drift-sandbox
    cancel-in-progress: true

permissions:
    contents: read
    issues: write

jobs:
    drift-detection:
        name: Detect Drift - Sandbox
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v2
              with:
                  terraform_version: 1.6.0

            - name: Azure Login
              uses: azure/login@v1
              with:
                  creds: ${{ secrets.AZURE_CREDENTIALS }}

            - name: Terraform Init
              run: |
                  cd infra/environments/sandbox
                  terraform init

            - name: Terraform Refresh
              id: refresh
              run: |
                  cd infra/environments/sandbox
                  terraform refresh \
                    -var-file=sandbox.tfvars \
                    -no-color 2>&1 | tee refresh.txt
              continue-on-error: true

            - name: Terraform Plan (Drift Check)
              id: plan
              run: |
                  cd infra/environments/sandbox
                  terraform plan \
                    -var-file=sandbox.tfvars \
                    -no-color \
                    2>&1 | tee drift_plan.txt

                  if grep -q "No changes\|infrastructure.*up to date" drift_plan.txt; then
                    echo "drift_detected=false" >> $GITHUB_OUTPUT
                  else
                    echo "drift_detected=true" >> $GITHUB_OUTPUT
                  fi
              continue-on-error: true

            - name: Create Drift Issue
              if: steps.plan.outputs.drift_detected == 'true'
              uses: actions/github-script@v7
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  script: |
                      const fs = require('fs');
                      const driftPlan = fs.readFileSync('infra/environments/sandbox/drift_plan.txt', 'utf8');

                      const issueBody = `## 🔍 Terraform Drift Detected - Sandbox

                      Drift detection identified differences between the Terraform state and actual Azure infrastructure.

                      **Detected Changes:**
                      \`\`\`
                      ${driftPlan.substring(0, 2000)}${driftPlan.length > 2000 ? '\n... (truncated)' : ''}
                      \`\`\`

                      **Action Required:**
                      1. Review the drift plan above
                      2. Investigate why infrastructure differs from code
                      3. Either:
                         - Update Terraform code to match actual state
                         - Apply Terraform to sync state with code
                      4. Close this issue when resolved

                      **Timestamp:** ${new Date().toISOString()}`;

                      // Check for existing open drift issue
                      const issues = await github.rest.issues.listForRepo({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        state: 'open',
                        labels: ['terraform', 'drift']
                      });

                      let existingIssue = issues.data.find(i => 
                        i.title.includes('Terraform Drift Detected') && 
                        i.title.includes('Sandbox')
                      );

                      if (existingIssue) {
                        // Update existing issue
                        await github.rest.issues.update({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          issue_number: existingIssue.number,
                          body: issueBody
                        });
                        console.log(`Updated existing drift issue #${existingIssue.number}`);
                      } else {
                        // Create new issue
                        const created = await github.rest.issues.create({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          title: '🔍 Terraform Drift Detected - Sandbox',
                          body: issueBody,
                          labels: ['terraform', 'drift', 'sandbox']
                        });
                        console.log(`Created new drift issue #${created.data.number}`);
                      }

            - name: Close Resolved Drift Issues
              if: steps.plan.outputs.drift_detected == 'false'
              uses: actions/github-script@v7
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  script: |
                      const issues = await github.rest.issues.listForRepo({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        state: 'open',
                        labels: ['terraform', 'drift']
                      });

                      for (const issue of issues.data) {
                        if (issue.title.includes('Terraform Drift Detected') && 
                            issue.title.includes('Sandbox')) {
                          await github.rest.issues.update({
                            owner: context.repo.owner,
                            repo: context.repo.repo,
                            issue_number: issue.number,
                            state: 'closed',
                            state_reason: 'completed'
                          });
                          console.log(`Closed resolved drift issue #${issue.number}`);
                        }
                      }
